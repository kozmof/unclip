name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Format
        run: cargo fmt --all --check

      - name: Sensor dependency policy
        shell: bash
        run: bash .github/scripts/check-sensor-dependencies.sh

      - name: Clippy
        # Deny warnings on workspace crates only; --no-deps avoids treating
        # dependency build-script warnings as hard errors.
        run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Test
        run: cargo test --locked --workspace --all-targets

      # `--all-targets` excludes doctests, so the `compile_fail` blocks that
      # document the epistemic boundary were never compiled by CI: one that
      # stopped failing would have gone unnoticed. The trybuild suite pins the
      # rendered diagnostics; this pins everything asserted only in the docs.
      - name: Doctests
        run: cargo test --locked --workspace --doc

      # Keep release-only code generation and optimization failures from being
      # discovered for the first time during packaging.
      - name: Release build
        run: cargo build --release --locked --workspace

      # Not the bare `cargo package`: workspace packaging republishes every
      # internal crate under one unchanging version, and Cargo caches registry
      # sources and artifacts as if that version were immutable. The script
      # drops those caches so the step verifies this commit rather than the
      # last one. See its header.
      - name: Package
        shell: bash
        run: bash .github/scripts/package-workspace.sh

  audit:
    name: cargo-deny (advisories + bans + sources + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check advisories bans sources licenses

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.82.8
        with:
          tool: cargo-llvm-cov@0.8.5
          fallback: none

      - name: Measure coverage
        run: cargo llvm-cov --locked --workspace --all-targets --summary-only --fail-under-lines 85
