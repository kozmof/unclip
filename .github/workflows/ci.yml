name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Deny warnings on workspace crates only; --no-deps avoids treating
        # dependency build-script warnings as hard errors.
        run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Test
        run: cargo test --locked --workspace --all-targets

      # Keep release-only code generation and optimization failures from being
      # discovered for the first time during packaging.
      - name: Release build
        run: cargo build --release --locked --workspace

  audit:
    name: cargo-deny (advisories + bans + sources + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check advisories bans sources licenses
